# Example reverse proxy — TLS termination and upstreams should match your deployment.
# Replace hostnames with your domains.

upstream backend_api {
    server 127.0.0.1:3001;
}

upstream app_user {
    server 127.0.0.1:3000;
}

upstream app_portfolio {
    server 127.0.0.1:3002;
}

upstream app_dashboard {
    server 127.0.0.1:3003;
}

upstream app_website {
    server 127.0.0.1:3004;
}

server {
    listen 80;
    server_name api.example.com;
    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name app.example.com;
    location / {
        proxy_pass http://app_user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name portfolio.example.com;
    location / {
        proxy_pass http://app_portfolio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
