# Production-oriented stack. Each service reads its own apps/<name>/.env (copy from .env.example);
# POSTGRES_* come from docker/.env. Next apps get BACKEND_URL for rewrites as a build arg.
# Usage: docker compose -f docker/docker-compose.prod.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devport}
      POSTGRES_USER: ${POSTGRES_USER:-devport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devport}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devport}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../apps/backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devport}:${POSTGRES_PASSWORD:-devport}@postgres:5432/${POSTGRES_DB:-devport}
    expose:
      - "3001"

  website:
    build:
      context: ..
      dockerfile: docker/Dockerfile.website
    restart: unless-stopped
    expose:
      - "80"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.next
      args:
        APP_NAME: app
        BACKEND_URL: http://backend:3001
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ../apps/app/.env
    expose:
      - "3000"

  portfolio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.next
      args:
        APP_NAME: portfolio
        BACKEND_URL: http://backend:3001
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ../apps/portfolio/.env
    expose:
      - "3000"

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.next
      args:
        APP_NAME: dashboard
        BACKEND_URL: http://backend:3001
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ../apps/dashboard/.env
    expose:
      - "3000"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - website
      - app
      - portfolio
      - dashboard

volumes:
  pgdata:
